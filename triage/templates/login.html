{% extends "base.html" %}
{% block title %}Sign in · Issue triage{% endblock %}
{% block main %}
<h1>Sign in</h1>
{% if error %}<p class="warn" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="inline">
  <label for="key" class="muted" style="flex-basis:100%">API key</label>
  <input type="password" id="key" name="key" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
