[project]
name = "github-issues-analyzer"
version = "2.0.0"
description = "Analyze GitHub issues using LLM with local caching - Async Version"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GitHub Issues Analyzer Team"}
]
keywords = ["github", "issues", "analyzer", "llm", "openai", "fastapi", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.109.0,<0.110.0",
    "uvicorn[standard]>=0.27.0,<0.28.0",
    "pydantic>=2.5.3,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "PyGithub>=2.1.1,<3.0.0",
    "openai>=1.12.0,<3.0.0",
    "sqlalchemy>=2.0.25,<3.0.0",
    "aiosqlite>=0.19.0,<0.20.0",
    "greenlet>=3.0.3,<4.0.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
local = [
    "fastembed>=0.4",
]

[project.urls]
Homepage = "https://github.com/yourusername/github-issues-analyzer"
Repository = "https://github.com/yourusername/github-issues-analyzer"
Documentation = "https://github.com/yourusername/github-issues-analyzer/blob/main/README.md"

[project.scripts]
github-issues-analyzer = "src.app:main"
triage = "triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "triage"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N818"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
